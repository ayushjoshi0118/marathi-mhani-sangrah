name: CI & Quality Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-build:
    name: Test & Next.js Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite (1,000 Proverbs Dataset & Devanagari Integrity)
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://marathi-mhani-sangrah.org
          NODE_ENV: production
